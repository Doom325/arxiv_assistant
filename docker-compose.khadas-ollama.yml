# Khadas override: use Gemma 3 12B on Framework Desktop for LLM tasks
# Usage: docker compose -f docker-compose.yml -f docker-compose.khadas-ollama.yml up
#
# Prerequisites:
#   1. Ollama running on Framework Desktop (192.168.1.32) with OLLAMA_HOST=0.0.0.0
#   2. Model pulled: ollama pull gemma3:12b
#   3. Framework Desktop reachable from Khadas on the local network
#
# Override FRAMEWORK_IP if the Framework Desktop IP changes:
#   FRAMEWORK_IP=192.168.1.100 docker compose -f docker-compose.yml -f docker-compose.khadas-ollama.yml up

services:
  backend:
    environment:
      - DATABASE_URL=postgresql://user:password@db:5432/arxiv_db
      - PDF_SAVE_DIR=/app/data
      - PYTHONUNBUFFERED=1
      # Backend uses Gemini for search embeddings, local LLM for chat/summarization
      - AI_PROVIDER=local
      - EMBEDDING_PROVIDER=gemini
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - RESEND_API_KEY=${RESEND_API_KEY}
      - EMAIL_SENDER=onboarding@resend.dev
      - EMAIL_RECIPIENTS=sumanth.gttpt@gmail.com
      # Ollama on Framework Desktop
      - OLLAMA_BASE_URL=http://${FRAMEWORK_IP:-192.168.1.32}:11434/v1
      - OLLAMA_CHAT_MODEL=gemma3:12b
      - OLLAMA_CLASSIFICATION_MODEL=gemma3:12b
      - OLLAMA_NUM_CTX=65536

  worker:
    environment:
      - DATABASE_URL=postgresql://user:password@db:5432/arxiv_db
      - PDF_SAVE_DIR=/app/data
      - PYTHONUNBUFFERED=1
      # Worker uses local LLM for all tasks except embeddings
      - AI_PROVIDER=local
      - EMBEDDING_PROVIDER=gemini
      - OLLAMA_BASE_URL=http://${FRAMEWORK_IP:-192.168.1.32}:11434/v1
      - OLLAMA_CHAT_MODEL=gemma3:12b
      - OLLAMA_CLASSIFICATION_MODEL=gemma3:12b
      - OLLAMA_NUM_CTX=65536
      - ENTITY_EXTRACTION_PROVIDER=llm
      - GEMINI_API_KEY=${GEMINI_API_KEY}
