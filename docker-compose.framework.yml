# Framework Desktop override
# Usage: docker compose -f docker-compose.yml -f docker-compose.framework.yml up
#
# Prerequisites:
#   1. Ollama running on host with Vulkan backend
#   2. Models pulled: ollama pull gemma3:27b && ollama pull gemma3:12b
#   3. External drive mounted (same drive from Khadas with DB + papers)
#   4. Set EXTERNAL_DRIVE_PATH env var to the mount point
#
# Example:
#   EXTERNAL_DRIVE_PATH=/mnt/external GEMINI_API_KEY=xxx docker compose \
#     -f docker-compose.yml -f docker-compose.framework.yml up

services:
  backend:
    volumes:
      - "${EXTERNAL_DRIVE_PATH}/PDFs/Arxiv Assistant:/app/data"
      - ./backend:/app
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - DATABASE_URL=postgresql://user:password@db:5432/arxiv_db
      - PDF_SAVE_DIR=/app/data
      - PYTHONUNBUFFERED=1
      # Backend keeps Gemini for embeddings (MRL support, better retrieval)
      - AI_PROVIDER=gemini
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - RESEND_API_KEY=${RESEND_API_KEY}
      - EMAIL_SENDER=onboarding@resend.dev
      - EMAIL_RECIPIENTS=sumanth.gttpt@gmail.com
      # Ollama config (for any local LLM calls from backend, e.g. chat)
      - OLLAMA_BASE_URL=http://host.docker.internal:11434/v1
      - OLLAMA_CHAT_MODEL=gemma3:27b
      - OLLAMA_CLASSIFICATION_MODEL=gemma3:27b
      - OLLAMA_NUM_CTX=65536

  worker:
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - "${EXTERNAL_DRIVE_PATH}/PDFs/Arxiv Assistant:/app/data"
      - ./backend:/app
    environment:
      - DATABASE_URL=postgresql://user:password@db:5432/arxiv_db
      - PDF_SAVE_DIR=/app/data
      - PYTHONUNBUFFERED=1
      # Worker uses local LLM for summarization, classification, citations, entities
      # but keeps Gemini for embeddings (MRL support, better retrieval quality)
      - AI_PROVIDER=local
      - EMBEDDING_PROVIDER=gemini
      - OLLAMA_BASE_URL=http://host.docker.internal:11434/v1
      - OLLAMA_CHAT_MODEL=gemma3:27b
      - OLLAMA_CLASSIFICATION_MODEL=gemma3:27b
      - OLLAMA_EMBEDDING_MODEL=nomic-embed-text
      - OLLAMA_NUM_CTX=65536
      - OLLAMA_EMBEDDING_TRUNCATION=8000
      # Use LLM for entity extraction instead of GLiNER
      - ENTITY_EXTRACTION_PROVIDER=llm
      # Keep Gemini key available for embedding generation in worker
      - GEMINI_API_KEY=${GEMINI_API_KEY}

  db:
    volumes:
      - "${EXTERNAL_DRIVE_PATH}/postgres/pgdata:/var/lib/postgresql/data"
      - ./backend/init.sql:/docker-entrypoint-initdb.d/init.sql

  ollama-mitmproxy:
    image: mitmproxy/mitmproxy:latest
    container_name: arxiv_assistant_mitmproxy
    ports:
      - "8434:8080"
      - "8081:8081"
      - "8765:8765"
    volumes:
      - ./backend/monitoring/ollama_metrics_addon.py:/addon.py
    # mitmproxy image includes Python. We install prometheus-client dynamically, then start mitmweb
    command: >
      bash -c "pip install prometheus-client --break-system-packages && mitmweb --mode reverse:http://host.docker.internal:11434 --web-host 0.0.0.0 --set termlog_verbosity=error -s /addon.py"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    container_name: arxiv_assistant_prometheus
    volumes:
      - ./backend/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    restart: unless-stopped
    depends_on:
      - ollama-mitmproxy

  grafana:
    image: grafana/grafana:latest
    container_name: arxiv_assistant_grafana
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_SERVER_HTTP_PORT=3000
    volumes:
      - ./backend/monitoring/grafana/provisioning:/etc/grafana/provisioning
      - ./backend/monitoring/grafana/dashboards:/var/lib/grafana/dashboards
    restart: unless-stopped
    depends_on:
      - prometheus
