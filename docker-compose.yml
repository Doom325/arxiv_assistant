services:
  backend:
    build:
      context: ./backend
    container_name: arxiv_assistant_backend
    ports:
      - "8000:8000"
      - "8085:8085"
    volumes:
      - "/media/khadas/External1/PDFs/Arxiv Assistant:/app/data"
      - ./backend:/app
    command: bash -c "pip install resend && uvicorn main:app --host 0.0.0.0 --port 8000 --timeout-keep-alive 120"
    restart: unless-stopped
    depends_on:
      - db
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - DATABASE_URL=postgresql://user:password@db:5432/arxiv_db
      - PDF_SAVE_DIR=/app/data
      - PYTHONUNBUFFERED=1
      - AI_PROVIDER=gemini
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - RESEND_API_KEY=${RESEND_API_KEY}
      - EMAIL_SENDER=onboarding@resend.dev
      - EMAIL_RECIPIENTS=sumanth.gttpt@gmail.com

  worker:
    build:
      context: ./backend
    container_name: arxiv_assistant_worker
    command: python production_worker.py
    volumes:
      - "/media/khadas/External1/PDFs/Arxiv Assistant:/app/data"
      - ./backend:/app
    environment:
      - DATABASE_URL=postgresql://user:password@db:5432/arxiv_db
      - PDF_SAVE_DIR=/app/data
      - PYTHONUNBUFFERED=1
    restart: unless-stopped
    depends_on:
      - db

  db:
    image: pgvector/pgvector:pg16
    container_name: arxiv_assistant_db
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: arxiv_db
    ports:
      - "5434:5432"
    volumes:
      - ${DB_STORAGE:-${DATA_DIR:-./backend/data}/postgres}/pgdata:/var/lib/postgresql/data
      - ./backend/init.sql:/docker-entrypoint-initdb.d/init.sql
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: "/api"
    container_name: arxiv_assistant_frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=/api
      - INTERNAL_API_URL=http://backend:8000
      - BACKEND_URL=http://backend:8000
    restart: unless-stopped
    depends_on:
      - backend
