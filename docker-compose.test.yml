# Test/staging stack — runs alongside production without conflicts.
# Different container names, ports, DB, and volumes.
#
# Usage:
#   docker compose -f docker-compose.test.yml up -d --build
#   docker compose -f docker-compose.test.yml down -v
#
# Ports:
#   Backend:  8001 (production uses 8000)
#   Frontend: 3001 (production uses 3000)
#   Database: 5435 (production uses 5434)

services:
  test-backend:
    build:
      context: ./backend
    container_name: arxiv_test_backend
    ports:
      - "8001:8000"
    volumes:
      - ./backend:/app
      - arxiv_test_pdfs:/app/data
    command: bash -c "pip install resend && uvicorn main:app --host 0.0.0.0 --port 8000 --timeout-keep-alive 120"
    restart: unless-stopped
    depends_on:
      - test-db
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - DATABASE_URL=postgresql://user:password@test-db:5432/arxiv_test_db
      - PDF_SAVE_DIR=/app/data
      - PYTHONUNBUFFERED=1
      # Staging shares the host egress IP with prod; let only prod poll arXiv
      # so the two stacks don't double the request rate and trip HTTP 429.
      - DISABLE_SCHEDULER=1
      - AI_PROVIDER=gemini
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - RESEND_API_KEY=${RESEND_API_KEY:-}
      - EMAIL_SENDER=${EMAIL_SENDER:-}
      - EMAIL_RECIPIENTS=${EMAIL_RECIPIENTS:-}

  test-worker:
    build:
      context: ./backend
    container_name: arxiv_test_worker
    command: python production_worker.py
    volumes:
      - ./backend:/app
      - arxiv_test_pdfs:/app/data
    environment:
      - DATABASE_URL=postgresql://user:password@test-db:5432/arxiv_test_db
      - PDF_SAVE_DIR=/app/data
      - PYTHONUNBUFFERED=1
    restart: unless-stopped
    depends_on:
      - test-db

  test-db:
    image: pgvector/pgvector:pg16
    container_name: arxiv_test_db
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: arxiv_test_db
    ports:
      - "5435:5432"
    volumes:
      - arxiv_test_pgdata:/var/lib/postgresql/data
      - ./backend/init.sql:/docker-entrypoint-initdb.d/init.sql
    restart: unless-stopped

  test-frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: "/api"
    container_name: arxiv_test_frontend
    ports:
      - "3001:3000"
    environment:
      - NEXT_PUBLIC_API_URL=/api
      - INTERNAL_API_URL=http://test-backend:8000
      - BACKEND_URL=http://test-backend:8000
    restart: unless-stopped
    depends_on:
      - test-backend

volumes:
  arxiv_test_pgdata:
  arxiv_test_pdfs:
