# Khadas override: proxy to Gemma 3 12B on the Framework Desktop's LiteLLM gateway
# Usage: docker compose -f docker-compose.yml -f docker-compose.khadas-ollama.yml up
#
# Prerequisites:
#   1. LiteLLM gateway running on Framework Desktop (192.168.1.32) on port 4000 with
#      gemma3:27b registered.
#   2. Framework Desktop reachable from Khadas on the local network.
#   3. Set LITELLM_API_KEY in the Khadas env before invoking docker compose.
#
# Override FRAMEWORK_IP if the Framework Desktop IP changes:
#   FRAMEWORK_IP=192.168.1.100 LITELLM_API_KEY=sk-... docker compose \
#     -f docker-compose.yml -f docker-compose.khadas-ollama.yml up

services:
      backend:
            environment:
                  - DATABASE_URL=postgresql://user:password@db:5432/arxiv_db
                  - PDF_SAVE_DIR=/app/data
                  - PYTHONUNBUFFERED=1
                  # Backend uses Gemini for search embeddings, local LLM for chat/summarization
                  - AI_PROVIDER=local
                  - EMBEDDING_PROVIDER=gemini
                  - GEMINI_API_KEY=${GEMINI_API_KEY}
                  - RESEND_API_KEY=${RESEND_API_KEY}
                  - NVIDIA_API_KEY=${NVIDIA_API_KEY:-}
                  - NVIDIA_BASE_URL=${NVIDIA_BASE_URL:-https://integrate.api.nvidia.com/v1}
                  - LLM_NVIDIA_MODEL=${LLM_NVIDIA_MODEL:-meta/llama-3.3-70b-instruct}
                  - EMAIL_SENDER=onboarding@resend.dev
                  - EMAIL_RECIPIENTS=sumanth.gttpt@gmail.com
                  # LiteLLM gateway on Framework Desktop
                  - LITELLM_BASE_URL=http://${FRAMEWORK_IP:-192.168.1.32}:4000/v1
                  - LITELLM_API_KEY=${LITELLM_API_KEY}
                  - LLM_CHAT_MODEL=nemotron3:nano
                  - LLM_CLASSIFICATION_MODEL=nemotron3:nano
                  # Suppresses scheduler during deploy migration window. See deploy.sh.
                  - MIGRATING=${MIGRATING:-0}

      grobid:
            # GROBID official image is x86_64 only; disable on ARM64 Khadas.
            # Citation extraction falls back gracefully (returns empty list).
            deploy:
                  replicas: 0

      worker:
            environment:
                  - DATABASE_URL=postgresql://user:password@db:5432/arxiv_db
                  - PDF_SAVE_DIR=/app/data
                  - PYTHONUNBUFFERED=1
                  # Worker uses local LLM for all tasks except embeddings
                  - AI_PROVIDER=local
                  - EMBEDDING_PROVIDER=gemini
                  - LITELLM_BASE_URL=http://${FRAMEWORK_IP:-192.168.1.32}:4000/v1
                  - LITELLM_API_KEY=${LITELLM_API_KEY}
                  - LLM_CHAT_MODEL=nemotron3:nano
                  - LLM_CLASSIFICATION_MODEL=nemotron3:nano
                  - ENTITY_EXTRACTION_PROVIDER=llm
                  - GEMINI_API_KEY=${GEMINI_API_KEY}
